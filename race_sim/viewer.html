<title>レース再生</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Roboto+Mono:wght@400;500;700&display=swap">
<style>
  :root {
    --paper: #f4f6f2;
    --surface: #ffffff;
    --ink: #15201a;
    --ink-2: #3d4c44;
    --ink-3: #6b7a71;
    --rule: #d8ded8;
    --rule-strong: #b6c0b8;
    --turf: #2f6b4f;
    --turf-soft: #e4ede7;
    --silk: #b83a26;
    --gold: #9a7418;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #101512;
      --surface: #19201c;
      --ink: #e8ede9;
      --ink-2: #b3c0b8;
      --ink-3: #849089;
      --rule: #2c3630;
      --rule-strong: #465049;
      --turf: #6cb891;
      --turf-soft: #1f2f27;
      --silk: #e8836e;
      --gold: #d1a94a;
    }
  }
  :root[data-theme="dark"] {
    --paper: #101512;
    --surface: #19201c;
    --ink: #e8ede9;
    --ink-2: #b3c0b8;
    --ink-3: #849089;
    --rule: #2c3630;
    --rule-strong: #465049;
    --turf: #6cb891;
    --turf-soft: #1f2f27;
    --silk: #e8836e;
    --gold: #d1a94a;
  }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    font-size: 15px;
    line-height: 1.7;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 22px 18px 56px; }

  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 20px; margin-bottom: 14px; }
  .race-title {
    font-family: "Shippori Mincho B1", "Yu Mincho", serif;
    font-size: clamp(20px, 3vw, 28px); font-weight: 700; margin: 0; letter-spacing: .02em;
  }
  .race-meta {
    display: flex; flex-wrap: wrap; gap: 3px 16px;
    font-family: "Roboto Mono", monospace; font-size: 12.5px; color: var(--ink-3);
  }
  .race-meta b { color: var(--ink-2); font-weight: 500; }

  /* ---- 走路 ---- */
  .stage {
    position: relative; overflow: hidden;
    border: 1px solid var(--rule-strong); background: #223028;
    aspect-ratio: 16 / 9;
  }
  canvas { display: block; width: 100%; height: 100%; }

  .overlay { position: absolute; inset: 0; pointer-events: none; color: #fff; }
  .remain {
    position: absolute; top: 3.5%; left: 2.4%;
    font-family: "Roboto Mono", monospace;
    text-shadow: 0 2px 10px rgba(0,0,0,.7);
  }
  .remain .n { font-size: clamp(26px, 4.4vw, 52px); font-weight: 700; line-height: 1; letter-spacing: -.01em; }
  .remain .u { font-size: clamp(11px, 1.4vw, 16px); margin-left: 4px; opacity: .85; }
  .remain .label { font-size: clamp(10px, 1.2vw, 13px); opacity: .8; display: block; margin-bottom: 2px; }
  .clock-big {
    font-family: "Roboto Mono", monospace; font-size: clamp(14px, 2vw, 24px);
    opacity: .9; margin-top: 4px;
  }
  .pace-chip {
    position: absolute; top: 3.5%; right: 2.4%;
    font-family: "Roboto Mono", monospace; font-size: clamp(10px, 1.3vw, 14px);
    background: rgba(0,0,0,.42); padding: 5px 12px; border-radius: 2px;
    text-shadow: none;
  }
  .live {
    position: absolute; left: 2.4%; top: 34%; width: min(28%, 230px);
    display: grid; gap: 2px; margin: 0; padding: 0;
  }
  .live li {
    display: grid; grid-template-columns: 18px 22px 1fr auto; gap: 6px; align-items: center;
    background: rgba(12,20,15,.66); padding: 3px 8px; border-radius: 2px;
    font-size: clamp(9px, 1.1vw, 12.5px); list-style: none;
  }
  .live li.mine { background: rgba(150,44,26,.82); }
  .live .rank { font-family: "Roboto Mono", monospace; opacity: .75; text-align: right; }
  .live .chip {
    display: grid; place-items: center; border-radius: 2px; height: 17px;
    font-family: "Roboto Mono", monospace; font-size: 11px; font-weight: 700;
    border: 1px solid rgba(0,0,0,.4);
  }
  .live .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .live .gp { font-family: "Roboto Mono", monospace; font-size: 11px; opacity: .8; }
  /* ゴール後の確定パネル */
  .finish {
    position: absolute; right: 2.4%; top: 14%; width: min(40%, 330px);
    background: rgba(12,20,15,.82); border-left: 3px solid #ffd45e;
    padding: 8px 12px 10px; border-radius: 2px;
  }
  .finish-head {
    font-family: "Roboto Mono", monospace; font-size: clamp(10px, 1.2vw, 13px);
    letter-spacing: .14em; color: #ffd45e; margin-bottom: 4px;
  }
  .finish table { width: 100%; border-collapse: collapse; font-size: clamp(9px, 1.15vw, 13px); }
  .finish td { padding: 2px 4px; border: none; white-space: nowrap; color: #fff; }
  .finish td.r { font-family: "Roboto Mono", monospace; width: 2.2em; text-align: right; opacity: .8; }
  .finish td.nm { overflow: hidden; text-overflow: ellipsis; max-width: 11em; }
  .finish td.tm { font-family: "Roboto Mono", monospace; text-align: right; font-variant-numeric: tabular-nums; }
  .finish tr.mine td { color: #ffe08a; }
  .call {
    position: absolute; left: 2.4%; right: 2.4%; bottom: 4%;
    background: rgba(12,20,15,.72); padding: 8px 14px; border-radius: 2px;
    font-size: clamp(11px, 1.5vw, 16px);
  }

  /* ---- 操作 ---- */
  .controls {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    padding: 12px 0; border-bottom: 1px solid var(--rule);
  }
  button {
    font: inherit; font-size: 13px; padding: 6px 13px; cursor: pointer;
    background: var(--surface); color: var(--ink);
    border: 1px solid var(--rule-strong); border-radius: 2px;
  }
  button:hover { border-color: var(--turf); }
  button:focus-visible { outline: 2px solid var(--turf); outline-offset: 2px; }
  button.primary { background: var(--turf); color: var(--paper); border-color: var(--turf); font-weight: 500; min-width: 104px; }
  .group { display: flex; }
  .group button { border-radius: 0; margin-left: -1px; min-width: 52px; }
  .group button[aria-pressed="true"] { background: var(--turf-soft); border-color: var(--turf); color: var(--turf); font-weight: 700; }
  .group.cams button { min-width: 62px; }
  input[type=range] { flex: 1 1 200px; min-width: 120px; accent-color: var(--turf); }
  .clock { font-family: "Roboto Mono", monospace; font-size: 13px; color: var(--ink-2); min-width: 58px; }
  .spacer { flex: 1 1 auto; }

  /* ---- 出走表・結果 ---- */
  .board { margin-top: 18px; }
  .board h3 {
    font-size: 11px; font-family: "Roboto Mono", monospace; letter-spacing: .12em;
    color: var(--ink-3); font-weight: 400; margin: 0 0 8px;
  }
  .scroller { overflow-x: auto; border: 1px solid var(--rule); background: var(--surface); }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { padding: 6px 11px; text-align: left; border-bottom: 1px solid var(--rule); white-space: nowrap; }
  thead th {
    font-family: "Roboto Mono", monospace; font-size: 10.5px; letter-spacing: .08em;
    color: var(--ink-3); font-weight: 400; border-bottom: 1px solid var(--rule-strong);
  }
  tbody tr:last-child td { border-bottom: none; }
  .num { font-family: "Roboto Mono", monospace; font-variant-numeric: tabular-nums; text-align: right; }
  td .chip {
    display: inline-grid; place-items: center; width: 22px; height: 17px; border-radius: 2px;
    font-family: "Roboto Mono", monospace; font-size: 11px; font-weight: 700;
    border: 1px solid rgba(0,0,0,.35);
  }
  tr.win td { background: var(--turf-soft); font-weight: 700; }
  tr.mine td { color: var(--silk); }
  .result-head { display: flex; align-items: baseline; gap: 14px; margin-top: 26px; }
  .result-head h3 { margin: 0; font-family: "Shippori Mincho B1", serif; font-size: 17px; }
  footer {
    margin-top: 24px; font-family: "Roboto Mono", monospace;
    font-size: 11.5px; color: var(--ink-3);
  }
  @media (prefers-reduced-motion: reduce) { .live li { transition: none; } }
</style>

<div class="wrap">
  <header>
    <h1 class="race-title" id="title">レース</h1>
    <div class="race-meta" id="meta"></div>
  </header>

  <div class="stage">
    <canvas id="track" width="1600" height="900"></canvas>
    <div class="overlay">
      <div class="remain">
        <span class="label">残り</span>
        <span class="n" id="remain-n">0</span><span class="u">m</span>
        <div class="clock-big" id="clock-big">0.0</div>
      </div>
      <div class="pace-chip" id="pace-chip"></div>
      <ol class="live" id="live"></ol>
      <div class="finish" id="finish" hidden>
        <div class="finish-head">確定</div>
        <table id="finish-body"></table>
      </div>
      <div class="call" id="call"></div>
    </div>
  </div>

  <div class="controls">
    <button class="primary" id="play">▶ スタート</button>
    <button id="restart">最初から</button>
    <span class="clock" id="clock">0.0s</span>
    <input type="range" id="scrub" min="0" max="1000" value="0" step="1" aria-label="再生位置">
    <span class="group cams" role="group" aria-label="カメラ">
      <button data-cam="chase" aria-pressed="true">追走</button>
      <button data-cam="wide">全体</button>
    </span>
    <span class="group" role="group" aria-label="再生速度">
      <button data-speed="1" aria-pressed="true">×1</button>

    </span>
  </div>

  <div class="board">
    <h3>出走表</h3>
    <div class="scroller">
      <table>
        <thead><tr><th>枠</th><th>馬番</th><th>馬名</th><th>脚質</th><th>毛色</th></tr></thead>

  <div class="result-head">

  <div class="scroller" id="result-wrap" hidden style="margin-top:10px">
    <table>
      <thead>
        <tr><th>着</th><th>馬番</th><th>馬名</th><th class="num">タイム</th><th class="num">着差</th>
            <th class="num">上り3F</th><th>通過</th><th>脚質</th></tr>
      </thead>
      <tbody id="result-body"></tbody>
    </table>
  </div>

  <footer id="footer"></footer>
</div>

<script>
(function () {
  'use strict';

  const DATA = JSON.parse(document.getElementById('race-data').textContent);
  const RACE = DATA.race;
  const HORSES = DATA.horses.slice().sort(function (a, b) { return a.no - b.no; });
  const N = HORSES.length;
  const DISTANCE = RACE.distance;
  const IS_DIRT = RACE.surface === 'ダ';

  // ====================================================
  // 馬のデータを描画用に整える
  // ====================================================
  // JRAの枠番の色。枠は均等割りで、余りは外枠から1頭ずつ足す。
  const WAKU = [
    { bg: '#ffffff', fg: '#1a1a1a', name: '白' }, { bg: '#1c1c1c', fg: '#ffffff', name: '黒' },
    { bg: '#d8402f', fg: '#ffffff', name: '赤' }, { bg: '#2f6cc4', fg: '#ffffff', name: '青' },
    { bg: '#f0c419', fg: '#1a1a1a', name: '黄' }, { bg: '#2f9e5e', fg: '#ffffff', name: '緑' },
    { bg: '#f07f2f', fg: '#1a1a1a', name: '橙' }, { bg: '#f2a3bd', fg: '#1a1a1a', name: '桃' }
  ];
  function wakuOf(no, size) {
    const counts = new Array(8).fill(Math.floor(size / 8));
    for (let i = 0; i < size % 8; i++) counts[7 - i] += 1;
    let seen = 0;
    for (let w = 0; w < 8; w++) { seen += counts[w]; if (no <= seen) return w; }
    return 7;
  }

  // 毛色。JRAの実際の割合におおよそ合わせ、馬名から決定的に決める。
  const COATS = [
    { p: 0.45, body: '#6b4226', dark: '#4a2c18', mane: '#3a2213', name: '鹿毛' },
    { p: 0.20, body: '#472e1d', dark: '#31200f', mane: '#241609', name: '黒鹿毛' },
    { p: 0.20, body: '#9c5f2e', dark: '#7d4a20', mane: '#c08a4a', name: '栗毛' },
    { p: 0.08, body: '#b6b1ab', dark: '#96918b', mane: '#e9e6e1', name: '芦毛' },
    { p: 0.05, body: '#34251b', dark: '#231810', mane: '#191009', name: '青鹿毛' },
    { p: 0.02, body: '#7a4520', dark: '#5d3416', mane: '#40230d', name: '栃栗毛' }
  ];
  function coatOf(name) {
    let hash = 0;
    for (let i = 0; i < name.length; i++) hash = (hash * 131 + name.charCodeAt(i)) % 1000003;
    let r = (hash % 1000) / 1000, acc = 0;
    for (let i = 0; i < COATS.length; i++) { acc += COATS[i].p; if (r <= acc) return COATS[i]; }
    return COATS[0];
  }

  HORSES.forEach(function (h, i) {
    let acc = 0;
    h.cum = h.splits.map(function (s) { acc += s; return acc; });
    h.sectionLen = DISTANCE / h.splits.length;
    h.waku = wakuOf(h.no, N);
    h.color = WAKU[h.waku];
    h.coat = coatOf(h.name);
    h.lane = i;                         // 走路の内から外への位置
  });
  const MAX_TIME = Math.max.apply(null, HORSES.map(function (h) { return h.time; }));
  // ⭕ ゴール後も馬は止まらない。全馬がゴールしたあと数秒は流して減速する姿を見せる。
  const RUNOUT_S = 4.0;
  const END_TIME = MAX_TIME + RUNOUT_S;
  const WINNER = DATA.horses.slice().sort(function (a, b) { return a.finish - b.finish; });
  // 2着との差がこれ以下なら接戦。ゴール前をスローで見せる
  const CLOSE_FINISH = WINNER.length > 1 && WINNER[1].margin <= 0.10;   // 1/2馬身以内
  const PACE_LABEL = DATA.pace > 0.15 ? 'ハイペース' : (DATA.pace < -0.15 ? 'スローペース' : '平均ペース');

  // ====================================================
  // コース形状
  // ====================================================
  // 実際のJRA各競馬場の「回り」「ゴール前直線」「1周距離」（芝）。
  // 内回り・外回りがある競馬場は代表して1つを使う。
  const COURSES = {
    '札幌': { turn: 1, straight: 266.1, lap: 1640.9 },
    '函館': { turn: 1, straight: 262.1, lap: 1626.6 },
    '福島': { turn: 1, straight: 292.0, lap: 1600.0 },
    '新潟': { turn: -1, straight: 358.7, lap: 1623.0 },
    '東京': { turn: -1, straight: 525.9, lap: 2083.1 },
    '中山': { turn: 1, straight: 310.0, lap: 1667.1 },
    '中京': { turn: -1, straight: 412.5, lap: 1705.9 },
    '京都': { turn: 1, straight: 328.4, lap: 1782.8 },
    '阪神': { turn: 1, straight: 356.5, lap: 1689.0 },
    '小倉': { turn: 1, straight: 293.0, lap: 1615.1 }
  };
  // 海外など形状データの無いコースは、近い国内コース（proxy_course）の形で描く
  const COURSE = COURSES[RACE.course] || COURSES[RACE.proxy_course] || COURSES['東京'];

  // ⭕ 楕円は「直線2本 ＋ 半円のコーナー2つ」で近似する。1周距離と直線の長さが
  //    分かればコーナーの半径が決まる。レースは必ずゴール（ホームストレッチの終点）で
  //    終わるので、距離を逆算すればスタート位置が決まり、道中でコーナーを回って
  //    最後に直線を向く、という競馬の形になる。
  const LAP = COURSE.lap;
  const HOME = COURSE.straight;
  const RADIUS = Math.max(60, (LAP - 2 * HOME) / (2 * Math.PI));
  const TURN_LEN = Math.PI * RADIUS;
  const TURN_SIGN = COURSE.turn;                 // +1=右回り, -1=左回り
  // 新潟の芝1000mだけは日本唯一の直線コース。
  const STRAIGHT_ONLY = RACE.course === '新潟' && !IS_DIRT && DISTANCE <= 1000;

  /** ゴールまで残り u メートルの地点の曲率（1/半径）。右回りなら正。 */
  function curvatureAt(u) {
    if (STRAIGHT_ONLY) return 0;
    let x = ((u % LAP) + LAP) % LAP;
    if (x < HOME) return 0;                       // ホームストレッチ
    x -= HOME;
    if (x < TURN_LEN) return TURN_SIGN / RADIUS;  // 3〜4コーナー
    x -= TURN_LEN;
    if (x < HOME) return 0;                       // 向正面
    return TURN_SIGN / RADIUS;                    // 1〜2コーナー
  }

  /** 走路の内側はどちら側か。右回りなら画面の右が内。 */
  const INNER = TURN_SIGN;

  /** その時刻に何メートル地点にいるか。区間の中は等速とみなして補間する。 */
  function distanceAt(h, t) {
    if (t >= h.time) return DISTANCE + runout(h, t - h.time);
    let i = 0;
    while (i < h.cum.length && h.cum[i] <= t) i++;
    const prev = i === 0 ? 0 : h.cum[i - 1];
    const split = h.splits[i];
    return Math.min(DISTANCE, (i + (split > 0 ? (t - prev) / split : 0)) * h.sectionLen);
  }

  /** ゴール後に流した距離。最後の区間の速度から、8秒かけて3割まで減速する。 */
  function runout(h, tau) {
    const v0 = h.sectionLen / Math.max(0.1, h.splits[h.splits.length - 1]);
    const brake = 5.6;                        // ここで速度が3割になる
    if (tau <= brake) return v0 * (tau - tau * tau / 16);
    return v0 * (brake - brake * brake / 16) + 0.3 * v0 * (tau - brake);
  }

  // ====================================================
  // 追走カメラ（後方から見た3D）
  // ====================================================
  // ⭕ 真横から見る形も試したが、走路が奥へ抜けていく後方視点のほうがはるかに立体に
  //    見える。ただし遠近をつけると着差が目で読めなくなるので、「全体」カメラと
  //    左の隊列オーバーレイで正確な差を担保する。
  const canvas = document.getElementById('track');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  const FOCAL = 1420;          // 焦点距離。大きいほど望遠になる
  const CAM_HEIGHT = 3.4;      // カメラの高さ(m)
  const CAM_BACK = 20;         // 最後方の馬の何m後ろから見るか。14だと手前の馬が巨大に映った
  // ⭕ カメラを走路の内側へ寄せ、馬群を画面の右半分に置く。中央に置くと
  //    馬が左右に広がってしまい、左の隊列オーバーレイと重なって両方見づらくなる。
  const CAM_LAT = -7;
  const HORIZON_Y = H * 0.30;
  const TRACK_W = 24;          // 走路の幅(m)
  const STRIDE_M = 7.0;        // ひと完歩で進む距離

  function cssVar(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }

  // ⭕ 走路の曲がりは「カメラから先の曲率を2回積分した横ずれ」で表す。コーナーでは
  //    走路が横へ流れ、直線に入ると正面を向く。毎フレーム、前方440mぶんを刻んで作る。
  const BEND_STEP = 4, BEND_STEPS = 112;
  let bendTable = [0];

  function buildBend(camD) {
    let heading = 0, offset = 0;
    bendTable = [0];
    for (let i = 0; i < BEND_STEPS; i++) {
      heading += curvatureAt(DISTANCE - (camD + i * BEND_STEP)) * BEND_STEP;
      offset += heading * BEND_STEP;
      bendTable.push(offset);
    }
  }

  function bendAt(depth) {
    const f = depth / BEND_STEP;
    const i = Math.max(0, Math.min(BEND_STEPS - 1, Math.floor(f)));
    return bendTable[i] + (bendTable[i + 1] - bendTable[i]) * (f - i);
  }

  /** 走路上の点(距離d, 横位置lat[m]) を画面座標へ落とす。latは正が画面右。 */
  function project(d, lat, camD) {
    const depth = d - camD;
    if (depth <= 1.2) return null;
    const k = FOCAL / depth;
    return {
      x: W / 2 + (lat - CAM_LAT + bendAt(depth)) * k,
      y: HORIZON_Y + CAM_HEIGHT * k, k: k, depth: depth
    };
  }

  /** ⭕ 馬番1が最内。内側は右回りなら画面の右、左回りなら左になる。 */
  function laneLat(lane) {
    const f = N > 1 ? lane / (N - 1) : 0.5;
    return INNER * (TRACK_W / 2 - 1.6) * (1 - 2 * f);
  }

  // ====================================================
  // 横位置（馬群の動き）
  // ====================================================
  // ⭕ エンジンは200m区間のタイムしか出さないので、横の動きはここで合成する。
  //    ルールは1つ：「前が空いていれば内へ寄り、詰まっていれば外へ持ち出す」。
  //    先頭から順に、前方の窓（少し後ろ〜数m前）に馬がいない一番内側の位置を狙う。
  //    順位が上がる馬は詰まった内を避けて外から来るので、通過順の変化がそのまま
  //    「内で詰まる」「外を回す」「抜け出す」に見える。
  //    横移動には速度の上限があるので、狙いが変わっても馬群は滑らかに動く。
  const LAT_STEP = 0.1;                       // 横位置を前計算する時間刻み[s]
  const LANE_W = 1.5;                         // 馬1頭ぶんの横幅[m]。これ未満に並ぶと接触
  // ⭕ 前方の窓。5mにすると縦に連なった馬が互いを塞いで内へ戻れず、後方の馬が外に取り残された
  const BLOCK_AHEAD = 3.0, BLOCK_BEHIND = 1.5; // この範囲に馬がいると詰まっている（馬体2.5m＋0.5m）
  const RATE_IN = 0.6, RATE_OUT = 2.2;        // 内へ寄る／外へ出る横速度[m/s]
  const GATE_HOLD_M = 150;                    // スタートからこの距離までは枠なりに走る
  const RAIL_MARGIN = 1.6;                    // ラチからの最小距離[m]
  const HALF = TRACK_W / 2 - RAIL_MARGIN;
  // 内側を0、外側を1とした位置 f と、走路上の横座標 lat の相互変換
  function fToLat(f) { return INNER * HALF * (1 - 2 * f); }
  function latToF(lat) { return (1 - lat / (INNER * HALF)) / 2; }

  const LAT_TABLE = (function () {
    const steps = Math.ceil(END_TIME / LAT_STEP) + 2;
    const table = HORSES.map(function () { return new Float32Array(steps); });
    const f = HORSES.map(function (h) { return N > 1 ? h.lane / (N - 1) : 0.5; });
    const maxF = 1, minF = 0;

    for (let s = 0; s < steps; s++) {
      const t = s * LAT_STEP;
      const d = HORSES.map(function (h) { return distanceAt(h, t); });
      const lead = Math.max.apply(null, d);
      const order = HORSES.map(function (_, i) { return i; }).sort(function (a, b) { return d[b] - d[a]; });
      const placed = [];                      // {d, f} すでに位置を決めた（前を走る）馬

      order.forEach(function (i) {
        let target = f[i];
        let blocked = false;                 // 詰まって避ける動きは速く、空いていて寄る動きは遅い
        if (lead >= GATE_HOLD_M && d[i] < DISTANCE) {
          // 前方の窓に馬がいない、一番内側の位置を探す
          const blockers = placed.filter(function (p) {
            const gap = p.d - d[i];
            return gap > -BLOCK_BEHIND && gap < BLOCK_AHEAD;
          });
          const free = function (cand) {
            return blockers.every(function (p) { return Math.abs(fToLat(p.f) - fToLat(cand)) >= LANE_W; });
          };
          // まず今の位置が空いていれば、そこから内へ寄れるだけ寄る
          blocked = !free(f[i]);
          if (!blocked) {
            target = f[i];
            for (let cand = f[i]; cand >= minF; cand -= 0.02) {
              if (free(cand)) target = cand; else break;
            }
          } else {
            // 詰まっている：内外の近いほうの空きへ。同じ距離なら内を取る
            // ⭕ 外だけを探すと、縦に連なった馬群がひたすら外へ階段状に膨らんだ
            target = f[i];
            let inner = null, outer = null;
            for (let cand = f[i]; cand >= minF; cand -= 0.02) { if (free(cand)) { inner = cand; break; } }
            for (let cand = f[i]; cand <= maxF; cand += 0.02) { if (free(cand)) { outer = cand; break; } }
            if (inner !== null && (outer === null || f[i] - inner <= outer - f[i])) target = inner;
            else if (outer !== null) target = outer;
          }
        }
        const rate = (blocked ? RATE_OUT : RATE_IN) * LAT_STEP / (2 * HALF);   // f の単位に換算
        if (Math.abs(target - f[i]) <= rate) f[i] = target;
        else f[i] += target > f[i] ? rate : -rate;
        f[i] = Math.max(minF, Math.min(maxF, f[i]));
        if (d[i] < DISTANCE) placed.push({ d: d[i], f: f[i] });   // ゴールした馬は前を塞がない
        table[i][s] = f[i];
      });
    }
    return table;
  })();

  /** その時刻の横位置 f（0=内ラチ側、1=外ラチ側）。刻みの間は線形補間。 */
  function laneFAt(i, t) {
    const row = LAT_TABLE[i];
    const x = Math.max(0, t / LAT_STEP);
    const s = Math.min(row.length - 2, Math.floor(x));
    const a = row[s], b = row[s + 1];
    return a + (b - a) * (x - s);
  }
  function latAt(i, t) { return fToLat(laneFAt(i, t)); }

  // ---- 空・遠景 ----
  function drawSky(camD) {
    const sky = ctx.createLinearGradient(0, 0, 0, HORIZON_Y + 30);
    sky.addColorStop(0, '#7f9fb8');
    sky.addColorStop(1, '#cddae0');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, HORIZON_Y + 30);

    // 遠くの木立とスタンド。カメラが進むとゆっくり流れる。
    const shift = -camD * 1.1;
    ctx.fillStyle = '#4d6b52';
    for (let i = 0; i < 70; i++) {
      const x = ((i * 137 + shift * 0.35) % (W + 400)) - 200;
      const hgt = 26 + (i * 17) % 30;
      ctx.beginPath();
      ctx.ellipse(x, HORIZON_Y - hgt * 0.35, 30, hgt * 0.55, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.fillStyle = 'rgba(44,54,62,.85)';
    ctx.fillRect(0, HORIZON_Y - 12, W, 14);
  }

  // ---- 走路 ----
  function drawGround(camD) {
    // ⭕ 走路だけを塗ると「走路の帯」が出ない。周囲（内馬場・外の芝生）を先に塗り、
    //    ラチの間だけを芝／ダートの色で塗り重ねる。ダートは茶色の帯が緑の中に浮かぶ。
    ctx.fillStyle = '#5b9457';
    ctx.fillRect(0, HORIZON_Y, W, H - HORIZON_Y);
    drawTrackBand(camD);

    const fade = ctx.createLinearGradient(0, HORIZON_Y, 0, HORIZON_Y + (H - HORIZON_Y) * 0.55);
    fade.addColorStop(0, 'rgba(170,200,175,.55)');
    fade.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = fade;
    ctx.fillRect(0, HORIZON_Y, W, H - HORIZON_Y);

    drawStripes(camD);
    drawInfield(camD);
    drawRail(camD, -TRACK_W / 2);
    drawRail(camD, TRACK_W / 2);
    drawTrees(camD);
    drawStand(camD);
    drawFurlongs(camD);
    drawFinish(camD);
  }

  /** ラチの間の走路。6mごとの四角形を奥から手前へ塗る。 */
  function drawTrackBand(camD) {
    ctx.fillStyle = IS_DIRT ? '#8d7150' : '#3f7a4e';
    const step = 6;
    for (let d = camD + 420; d > camD + 1; d -= step) {
      const a = project(d - step, -TRACK_W / 2 - 0.3, camD), b = project(d, -TRACK_W / 2 - 0.3, camD);
      const c = project(d, TRACK_W / 2 + 0.3, camD), e = project(d - step, TRACK_W / 2 + 0.3, camD);
      if (!a || !b || !c || !e) continue;
      if (Math.abs(a.x - W / 2) > W * 1.5 && Math.abs(e.x - W / 2) > W * 1.5) continue;
      ctx.beginPath();
      ctx.moveTo(a.x, a.y + 1); ctx.lineTo(b.x, b.y); ctx.lineTo(c.x, c.y); ctx.lineTo(e.x, e.y + 1);
      ctx.closePath(); ctx.fill();
    }
  }

  /** 内馬場。内ラチの向こうに生垣と、少し明るい芝。 */
  function drawInfield(camD) {
    const lat = INNER * (TRACK_W / 2 + 2.2);
    ctx.fillStyle = '#2f6a3c';
    for (let d = camD + 400; d > camD + 3; d -= 8) {
      const a = project(d - 8, lat, camD), b = project(d, lat, camD);
      if (!a || !b) continue;
      if (Math.abs(a.x - W / 2) > W * 1.5) continue;
      const hA = 0.9 * a.k, hB = 0.9 * b.k;
      ctx.beginPath();
      ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.lineTo(b.x, b.y - hB); ctx.lineTo(a.x, a.y - hA);
      ctx.closePath(); ctx.fill();
    }
  }

  /** ホームストレッチの外側のスタンド。奥から手前へ、20mごとのブロックを積む。 */
  function drawStand(camD) {
    const from = DISTANCE - HOME - 40, to = DISTANCE + 80;
    const lat = -INNER * (TRACK_W / 2 + 16);     // 走路から少し引いて、手前の馬に被らないように
    const seg = 20;
    for (let d = Math.min(to, camD + 420); d > Math.max(from, camD + 8); d -= seg) {
      const near = project(Math.max(d - seg, from), lat, camD), far = project(d, lat, camD);
      if (!near || !far) continue;
      if (Math.abs(near.x - W / 2) > W * 1.6) continue;
      const hN = 13 * near.k, hF = 13 * far.k;
      // 本体
      ctx.fillStyle = '#c9cfd3';
      ctx.beginPath();
      ctx.moveTo(near.x, near.y); ctx.lineTo(far.x, far.y); ctx.lineTo(far.x, far.y - hF); ctx.lineTo(near.x, near.y - hN);
      ctx.closePath(); ctx.fill();
      // 観客席（段々の帯）
      const tiers = ['#6f7a86', '#8a94a0', '#a3acb6'];
      tiers.forEach(function (color, i) {
        const y0 = 0.25 + i * 0.2, y1 = y0 + 0.16;
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.moveTo(near.x, near.y - hN * y0); ctx.lineTo(far.x, far.y - hF * y0);
        ctx.lineTo(far.x, far.y - hF * y1); ctx.lineTo(near.x, near.y - hN * y1);
        ctx.closePath(); ctx.fill();
      });
      // 屋根
      ctx.fillStyle = '#3d4750';
      ctx.beginPath();
      ctx.moveTo(near.x, near.y - hN); ctx.lineTo(far.x, far.y - hF);
      ctx.lineTo(far.x, far.y - hF * 1.08); ctx.lineTo(near.x, near.y - hN * 1.08);
      ctx.closePath(); ctx.fill();
    }
  }

  function drawStripes(camD) {
    const band = 25;
    const start = Math.floor(camD / band) * band;
    ctx.fillStyle = IS_DIRT ? 'rgba(0,0,0,.05)' : 'rgba(255,255,255,.05)';
    for (let d = start; d < camD + 420; d += band * 2) {
      const a = project(d, -TRACK_W / 2, camD), b = project(d + band, -TRACK_W / 2, camD);
      const c = project(d + band, TRACK_W / 2, camD), e = project(d, TRACK_W / 2, camD);
      if (!a || !b || !c || !e) continue;
      // ⭕ コーナーでは走路が横へ流れ、遠方は画面外へ出ていく。実際の中継でも
      //    コーナーの先は見えないので、外れたところで描くのをやめる。
      if (Math.abs(a.x - W / 2) > W * 1.5) break;
      ctx.beginPath();
      ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.lineTo(c.x, c.y); ctx.lineTo(e.x, e.y);
      ctx.closePath(); ctx.fill();
    }
  }

  function drawRail(camD, lat) {
    // 上段・下段の2本。手前ほど太い
    [1.15, 0.6].forEach(function (height, row) {
      ctx.strokeStyle = row === 0 ? 'rgba(245,248,243,.95)' : 'rgba(245,248,243,.7)';
      ctx.lineWidth = row === 0 ? 2.5 : 1.6;
      ctx.beginPath();
      let started = false;
      for (let d = camD + 2; d < camD + 420; d += 6) {
        const p = project(d, lat, camD);
        if (!p) continue;
        if (Math.abs(p.x - W / 2) > W * 1.5) break;
        const top = p.y - height * p.k;
        if (!started) { ctx.moveTo(p.x, top); started = true; } else ctx.lineTo(p.x, top);
      }
      ctx.stroke();
    });

    const step = 12;
    const first = Math.ceil((camD + 4) / step) * step;
    for (let d = first; d < camD + 400; d += step) {
      const p = project(d, lat, camD);
      if (!p) continue;
      if (Math.abs(p.x - W / 2) > W * 1.5) break;
      ctx.fillStyle = 'rgba(0,0,0,.18)';                                   // 支柱の影
      ctx.fillRect(p.x - 0.06 * p.k, p.y - 0.05 * p.k, 0.5 * p.k, 0.1 * p.k);
      ctx.fillStyle = 'rgba(245,248,243,.85)';
      ctx.fillRect(p.x - 0.06 * p.k, p.y - 1.2 * p.k, 0.12 * p.k, 1.2 * p.k);
    }
  }

  function drawTrees(camD) {
    if (IS_DIRT) return;
    const step = 45;
    const first = Math.floor(camD / step) * step;
    for (let d = first + step * 8; d > camD + 6; d -= step) {
      if (d > DISTANCE - HOME - 40 && d < DISTANCE + 80) continue;     // スタンドの区間
      const p = project(d, -INNER * (TRACK_W / 2 + 14), camD);
      // ⭕ 近すぎる木は巨大になって走路に生えて見えるので描かない。
      if (!p || p.depth < 26 || p.x < -200 || p.x > W + 200) continue;
      const th = 5.5 * p.k;
      ctx.fillStyle = '#5a4632';
      ctx.fillRect(p.x - 0.22 * p.k, p.y - th * 0.45, 0.44 * p.k, th * 0.45);
      ctx.fillStyle = '#3d7a49';
      ctx.beginPath();
      ctx.ellipse(p.x, p.y - th * 0.62, 2.0 * p.k, 2.5 * p.k, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.10)';
      ctx.beginPath();
      ctx.ellipse(p.x - 0.6 * p.k, p.y - th * 0.75, 1.1 * p.k, 1.3 * p.k, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawFurlongs(camD) {
    ctx.textAlign = 'center';
    for (let d = 0; d <= DISTANCE; d += 200) {
      if (d < camD + 3 || d > camD + 400) continue;
      const p = project(d, TRACK_W / 2 + 1.4, camD);
      if (!p) continue;
      const hgt = 2.6 * p.k;
      ctx.fillStyle = '#f2f4f0';
      ctx.fillRect(p.x - 0.12 * p.k, p.y - hgt, 0.24 * p.k, hgt);
      ctx.fillStyle = '#e8402c';
      ctx.fillRect(p.x - 0.12 * p.k, p.y - hgt, 0.24 * p.k, hgt * 0.22);
      if (p.k > 12) {
        ctx.fillStyle = 'rgba(255,255,255,.9)';
        ctx.font = '700 ' + Math.max(10, Math.round(0.26 * p.k)) + 'px "Roboto Mono", monospace';
        ctx.fillText(String(DISTANCE - d), p.x, p.y - hgt - 6);
      }
    }
  }

  function drawFinish(camD) {
    if (DISTANCE < camD + 2 || DISTANCE > camD + 420) return;
    const a = project(DISTANCE, -TRACK_W / 2, camD), b = project(DISTANCE, TRACK_W / 2, camD);
    if (!a || !b) return;
    ctx.strokeStyle = 'rgba(255,255,255,.95)';
    ctx.lineWidth = Math.max(2, 0.35 * a.k);
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    // ゴール板
    [a, b].forEach(function (p) {
      ctx.fillStyle = '#e8402c';
      ctx.fillRect(p.x - 0.18 * p.k, p.y - 3.4 * p.k, 0.36 * p.k, 3.4 * p.k);
    });
  }

  // ---- 馬（後方から見たかたち） ----
  function drawHorseRear(p, h, phase, lateralOffset) {
    const k = p.k;
    const S = k / 30;                         // 体高1.6m前後に相当する大きさ
    const coat = h.coat;
    const skew = Math.max(-1, Math.min(1, lateralOffset / 12));   // 中央から外れるほど斜めに見える
    // ⭕ 襲歩（ギャロップ）は1完歩に「後脚で蹴る→伸びる→前脚で着く→集める」がある。
    //    胴の上下は完歩に1回、脚は左右で位相をずらす。
    const gallop = Math.sin(phase);
    const bob = (0.5 - 0.5 * Math.cos(phase)) * 1.6 * S;          // 伸びたとき高く、集めたとき低い
    const x = p.x, y = p.y + bob;
    ctx.lineCap = 'round';

    // ---- 首と頭（一番奥）。斜めのときだけ体の横に見える。真後ろでは騎手の陰 ----
    if (Math.abs(skew) > 0.12) {
      const neckBaseX = x + skew * 9 * S, neckBaseY = y - 30 * S;
      const headX = neckBaseX + skew * 9 * S, headY = neckBaseY - 4 * S + gallop * 1.5 * S;
      ctx.strokeStyle = coat.dark;
      ctx.lineWidth = 5.5 * S;
      ctx.beginPath(); ctx.moveTo(neckBaseX, neckBaseY); ctx.lineTo(headX, headY); ctx.stroke();
      ctx.fillStyle = coat.body;
      ctx.beginPath(); ctx.ellipse(headX + skew * 2 * S, headY - 1.5 * S, 3.2 * S, 4.2 * S, skew * 0.5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = coat.dark;                                       // 耳
      ctx.beginPath();
      ctx.moveTo(headX + skew * 2 * S, headY - 5 * S);
      ctx.lineTo(headX + skew * 2 * S - 1.4 * S, headY - 8 * S);
      ctx.lineTo(headX + skew * 2 * S + 1.2 * S, headY - 6.5 * S);
      ctx.fill();
    }

    // ---- 前脚（胴の奥）。後脚と半周ずれて動く ----
    ctx.strokeStyle = coat.dark;
    ctx.lineWidth = 2.6 * S;
    [-1, 1].forEach(function (side, idx) {
      const a = phase + Math.PI + idx * 0.9;
      const swing = Math.sin(a);
      const shX = x + side * 4.2 * S + skew * 7 * S, shY = y - 22 * S;
      const kneeX = shX + swing * 1.5 * S, kneeY = shY + 7 * S - Math.max(0, swing) * 2 * S;
      const hoofX = kneeX + swing * 2.5 * S, hoofY = y - 1.5 * S - Math.max(0, -swing) * 4.5 * S;
      ctx.beginPath(); ctx.moveTo(shX, shY); ctx.lineTo(kneeX, kneeY); ctx.lineTo(hoofX, hoofY); ctx.stroke();
    });

    // ---- 胴（肩から腰へ）。奥の肩を先に、手前のトモをあとに ----
    ctx.fillStyle = coat.body;
    ctx.beginPath(); ctx.ellipse(x + skew * 7 * S, y - 25 * S, 7 * S, 8.5 * S, skew * 0.1, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x + skew * 2 * S, y - 20 * S, 8.5 * S, 11 * S, skew * 0.12, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = coat.dark;                                         // 尻の陰影
    ctx.beginPath(); ctx.ellipse(x + skew * 2 * S - 3.4 * S, y - 20 * S, 4.2 * S, 10 * S, skew * 0.12, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.18)';                               // 背線
    ctx.lineWidth = 1.2 * S;
    ctx.beginPath(); ctx.moveTo(x + skew * 2 * S, y - 31 * S); ctx.lineTo(x + skew * 2 * S, y - 12 * S); ctx.stroke();

    // ---- 後脚（手前）。蹴り出しで後ろへ伸び、集めで腹の下へ ----
    [-1, 1].forEach(function (side, idx) {
      const a = phase + idx * 0.7;
      const swing = Math.sin(a);
      const hipX = x + side * 5.5 * S + skew * 1.5 * S, hipY = y - 15 * S;
      const hockX = hipX + side * 1.2 * S + swing * 1.5 * S, hockY = hipY + 7.5 * S - Math.max(0, -swing) * 3 * S;
      const hoofX = hockX + side * 0.6 * S + swing * 3.5 * S, hoofY = y - Math.max(0, swing) * 6 * S;
      ctx.strokeStyle = coat.mane;
      ctx.lineWidth = 3.6 * S;
      ctx.beginPath(); ctx.moveTo(hipX, hipY); ctx.lineTo(hockX, hockY); ctx.lineTo(hoofX, hoofY); ctx.stroke();
      ctx.fillStyle = '#1a120c';                                       // 蹄
      ctx.beginPath(); ctx.ellipse(hoofX, hoofY, 1.6 * S, 1.0 * S, 0, 0, Math.PI * 2); ctx.fill();
      // ⭕ ダートは着地のたびに砂が舞う。手前へ飛ぶので少し大きく、薄く
      if (IS_DIRT && swing > 0.55) {
        const alpha = 0.45 * (swing - 0.55) / 0.45;
        ctx.fillStyle = 'rgba(214,190,150,' + alpha.toFixed(2) + ')';
        for (let j = 0; j < 3; j++) {
          const spread = (j - 1) * 2.2 * S + side * 1.5 * S;
          ctx.beginPath();
          ctx.ellipse(hoofX + spread, hoofY + 1.5 * S + j * 0.8 * S, (2.2 + j * 0.8) * S, (1.4 + j * 0.5) * S, 0, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    });

    // ---- 尾。走ると後ろへ流れ、こちらへ向く ----
    ctx.strokeStyle = coat.mane;
    ctx.lineWidth = 4.4 * S;
    ctx.beginPath();
    ctx.moveTo(x + skew * 2 * S, y - 27 * S);
    ctx.quadraticCurveTo(x + Math.sin(phase) * 3 * S, y - 20 * S, x + Math.sin(phase) * 5 * S, y - 9 * S + gallop * 2 * S);
    ctx.stroke();
    ctx.lineWidth = 2.6 * S;
    ctx.beginPath();
    ctx.moveTo(x + skew * 2 * S, y - 26 * S);
    ctx.quadraticCurveTo(x + Math.sin(phase + 0.8) * 4 * S, y - 19 * S, x + Math.sin(phase + 0.8) * 7 * S, y - 7 * S + gallop * 2 * S);
    ctx.stroke();

    // ---- 騎手。前傾して背中を丸め、完歩に合わせて上体が上下する ----
    const jx = x + skew * 4 * S, jy = y - 33 * S - bob * 0.35;
    ctx.fillStyle = h.color.bg;                                        // 背中（勝負服）
    ctx.beginPath(); ctx.ellipse(jx, jy, 7.2 * S, 7.5 * S, skew * 0.15, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,.2)';
    ctx.beginPath(); ctx.ellipse(jx - 2.6 * S, jy, 3 * S, 7 * S, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#f1e5d2';                                         // 白いパンツ
    ctx.beginPath(); ctx.ellipse(jx, jy + 6 * S, 6.5 * S, 3.2 * S, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#1b1b1b';                                       // 長靴
    ctx.lineWidth = 2.4 * S;
    ctx.beginPath(); ctx.moveTo(jx - 8 * S, jy + 3 * S); ctx.lineTo(jx - 9.5 * S, jy + 11 * S); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(jx + 8 * S, jy + 3 * S); ctx.lineTo(jx + 9.5 * S, jy + 11 * S); ctx.stroke();
    ctx.strokeStyle = h.color.bg;                                      // 腕（手綱へ）
    ctx.lineWidth = 2.6 * S;
    ctx.beginPath(); ctx.moveTo(jx - 5 * S, jy - 1 * S); ctx.lineTo(jx - 7 * S + skew * 6 * S, jy - 7 * S); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(jx + 5 * S, jy - 1 * S); ctx.lineTo(jx + 7 * S + skew * 6 * S, jy - 7 * S); ctx.stroke();
    ctx.fillStyle = h.color.bg;                                        // ヘルメット
    ctx.beginPath(); ctx.arc(jx + skew * 1.5 * S, jy - 8.5 * S, 4.4 * S, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.55)';
    ctx.lineWidth = 1.1 * S;
    ctx.beginPath(); ctx.arc(jx + skew * 1.5 * S, jy - 8.5 * S, 4.4 * S, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
  }

  /** 馬番のタグ。⭕ 馬体に番号を描くと奥では読めないので頭上に出す。 */
  function drawTag(p, h, showName) {
    const k = p.k;
    if (k < 7) return;
    const w = Math.max(17, 0.62 * k), hgt = Math.max(13, 0.46 * k);
    const y = p.y - 1.75 * k;
    ctx.fillStyle = h.color.bg;
    ctx.strokeStyle = h.is_player ? '#ffd45e' : 'rgba(0,0,0,.45)';
    ctx.lineWidth = h.is_player ? 2.4 : 1;
    ctx.beginPath(); ctx.rect(p.x - w / 2, y - hgt, w, hgt);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = h.color.fg;
    ctx.font = '700 ' + Math.round(hgt * 0.78) + 'px "Roboto Mono", monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(String(h.no), p.x, y - hgt / 2 + 1);
    ctx.textBaseline = 'alphabetic';

    if (showName && k > 11) {
      ctx.font = '500 ' + Math.round(Math.max(12, 0.34 * k)) + 'px "Zen Kaku Gothic New", sans-serif';
      ctx.fillStyle = 'rgba(0,0,0,.55)';
      ctx.fillText(h.name, p.x + 1, y - hgt - 5);
      ctx.fillStyle = h.is_player ? '#ffe08a' : '#ffffff';
      ctx.fillText(h.name, p.x, y - hgt - 6);
    }
  }

  // ---- コースの全体図 ----
  /** ゴールまで残りuメートルの地点を、真上から見た座標(m)で返す。 */
  function ovalPoint(u) {
    let x = ((u % LAP) + LAP) % LAP, px, py;
    if (x < HOME) { px = HOME - x; py = 0; }
    else if (x < HOME + TURN_LEN) {
      const th = (x - HOME) / RADIUS;
      px = -RADIUS * Math.sin(th); py = RADIUS - RADIUS * Math.cos(th);
    } else if (x < 2 * HOME + TURN_LEN) { px = x - HOME - TURN_LEN; py = 2 * RADIUS; }
    else {
      const ph = (x - 2 * HOME - TURN_LEN) / RADIUS;
      px = HOME + RADIUS * Math.sin(ph); py = RADIUS + RADIUS * Math.cos(ph);
    }
    // ⭕ この式は左回りの形。右回りの競馬場は左右を反転させる。
    return { x: TURN_SIGN > 0 ? HOME - px : px, y: py };
  }

  function drawCourseMap(leadD, playerD) {
    const boxW = W * 0.19, boxH = boxW * 0.62;
    const bx = W - boxW - W * 0.025, by = H - boxH - H * 0.16;

    ctx.fillStyle = 'rgba(12,20,15,.62)';
    ctx.fillRect(bx - 10, by - 10, boxW + 20, boxH + 26);

    const spanX = HOME + 2 * RADIUS, spanY = 2 * RADIUS;
    const sc = Math.min(boxW / spanX, boxH / spanY) * 0.88;
    const ox = bx + boxW / 2, oy = by + boxH / 2;
    function toScreen(p) {
      return { x: ox + (p.x - HOME / 2) * sc, y: oy + (p.y - RADIUS) * sc };
    }

    if (STRAIGHT_ONLY) {
      ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(bx + 8, oy); ctx.lineTo(bx + boxW - 8, oy); ctx.stroke();
    } else {
      ctx.strokeStyle = 'rgba(255,255,255,.5)';
      ctx.lineWidth = Math.max(2, boxW * 0.022);
      ctx.beginPath();
      for (let u = 0; u <= LAP; u += LAP / 160) {
        const p = toScreen(ovalPoint(u));
        if (u === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
      }
      ctx.closePath(); ctx.stroke();
    }

    // ゴール板
    const g = toScreen(ovalPoint(0));
    ctx.fillStyle = '#e8402c';
    ctx.fillRect(g.x - 3, g.y - 6, 6, 12);

    // 馬群（先頭と自分の馬）
    function dot(d, color, r) {
      if (STRAIGHT_ONLY) {
        const f = 1 - (DISTANCE - d) / DISTANCE;
        const x = bx + 8 + (boxW - 16) * f;
        ctx.beginPath(); ctx.arc(x, oy, r, 0, Math.PI * 2);
      } else {
        const p = toScreen(ovalPoint(DISTANCE - d));
        ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
      }
      ctx.fillStyle = color; ctx.fill();
    }
    dot(leadD, '#ffffff', Math.max(3, boxW * 0.026));
    if (playerD !== null) dot(playerD, '#ffd45e', Math.max(4, boxW * 0.032));

    ctx.fillStyle = 'rgba(255,255,255,.8)';
    ctx.font = '500 ' + Math.round(boxW * 0.1) + 'px "Roboto Mono", monospace';
    ctx.textAlign = 'center';
    ctx.fillText(RACE.course + ' ' + (TURN_SIGN > 0 ? '右回り' : '左回り'), bx + boxW / 2, by + boxH + 12);
  }

  function drawChase(t, positions, ranked) {
    const tail = Math.min.apply(null, positions);
    const camD = tail - CAM_BACK;

    buildBend(camD);
    drawSky(camD);
    drawGround(camD);

    // 奥（遠い＝先頭）から描き、手前の馬が重なるようにする
    const drawable = HORSES.map(function (h, i) {
      return { h: h, d: positions[i], lat: latAt(i, t) };
    }).sort(function (a, b) { return b.d - a.d; });

    drawable.forEach(function (o) {
      const p = project(o.d, o.lat, camD);
      if (!p || p.x < -260 || p.x > W + 260) return;
      ctx.beginPath();                                // 影
      ctx.ellipse(p.x, p.y + 0.1 * p.k, 0.95 * p.k, 0.28 * p.k, 0, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(0,0,0,.28)';
      ctx.fill();

      drawHorseRear(p, o.h, (o.d / STRIDE_M) * Math.PI * 2, o.lat - CAM_LAT + bendAt(p.depth));
      // ⭕ 上位3頭に名前を出すと、先頭が団子になったとき文字が重なって潰れる。
      drawTag(p, o.h, o.h.is_player || o.h.currentPos === 1);
    });

    const mine = HORSES.filter(function (h) { return h.is_player; })[0];
    drawCourseMap(Math.max.apply(null, positions),
                  mine ? positions[HORSES.indexOf(mine)] : null);
  }

  // ====================================================
  // 全体カメラ（着差を読むための平面図）
  // ====================================================
  function drawWide(t, positions, ranked) {
    ctx.fillStyle = IS_DIRT ? '#8d7150' : '#3f7a4e';
    ctx.fillRect(0, 0, W, H);

    const lead = Math.max.apply(null, positions);
    const tailD = Math.min.apply(null, positions);
    const spread = Math.max(40, (lead - tailD) * 1.4);
    const mPerPx = spread / (W * 0.6);
    const camStart = lead - W * 0.74 * mPerPx;
    const top = H * 0.10, bottom = H * 0.86;
    const laneH = (bottom - top) / N;

    ctx.fillStyle = IS_DIRT ? 'rgba(0,0,0,.06)' : 'rgba(255,255,255,.06)';
    const stripe = 25 / mPerPx;
    for (let x = -((camStart / 25 % 1) * stripe); x < W; x += stripe * 2) {
      ctx.fillRect(x, top, stripe, bottom - top);
    }
    ctx.fillStyle = 'rgba(245,248,243,.9)';
    ctx.fillRect(0, top - 5, W, 5); ctx.fillRect(0, bottom, W, 5);

    ctx.textAlign = 'center';
    ctx.font = '500 20px "Roboto Mono", monospace';
    for (let d = 0; d <= DISTANCE; d += 200) {
      const x = (d - camStart) / mPerPx;
      if (x < -60 || x > W + 60) continue;
      ctx.fillStyle = 'rgba(255,255,255,.28)';
      ctx.fillRect(x - 1.5, top, 3, bottom - top);
      ctx.fillStyle = 'rgba(255,255,255,.85)';
      ctx.fillText(d === DISTANCE ? 'ゴール' : (DISTANCE - d) + 'm', x, top + 26);
    }
    const gx = (DISTANCE - camStart) / mPerPx;
    if (gx > -20 && gx < W + 20) {
      ctx.fillStyle = '#e8402c';
      ctx.fillRect(gx - 3, top - 5, 6, bottom - top + 10);
    }

    // ⭕ 上から見た図。縦は実際の横位置（下が内ラチ）なので、馬群の形がそのまま出る
    const drawOrder = HORSES.map(function (h, i) { return i; })
      .sort(function (a, b) { return laneFAt(a, t) - laneFAt(b, t); });
    drawOrder.forEach(function (i) {
      const h = HORSES[i];
      const x = (positions[i] - camStart) / mPerPx;
      const y = bottom - 14 - (bottom - top - 28) * laneFAt(i, t);
      const r = Math.min(16, laneH / 2 - 2);
      if (h.is_player) {
        ctx.beginPath(); ctx.arc(x, y, r + 5, 0, Math.PI * 2);
        ctx.strokeStyle = '#ffd45e'; ctx.lineWidth = 3.5; ctx.stroke();
      }
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fillStyle = h.color.bg; ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,.5)'; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.fillStyle = h.color.fg;
      ctx.font = '700 ' + Math.round(r * 1.15) + 'px "Roboto Mono", monospace';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(String(h.no), x, y + 1);
      ctx.textBaseline = 'alphabetic';
      if (h.is_player || h.currentPos <= 3) {
        ctx.textAlign = 'left';
        ctx.font = '500 19px "Zen Kaku Gothic New", sans-serif';
        ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillText(h.name, x + r + 8, y + 7);
        ctx.fillStyle = h.is_player ? '#ffe08a' : '#fff'; ctx.fillText(h.name, x + r + 7, y + 6);
      }
    });
  }

  // ====================================================
  // 実況
  // ====================================================
  function commentary(t, ranked, lead) {
    const prog = lead / DISTANCE;
    const top = ranked[0].h, second = ranked[1] ? ranked[1].h : null;
    const mine = ranked.filter(function (r) { return r.h.is_player; })[0];
    const minePos = mine ? mine.h.currentPos : null;
    const remain = Math.round(DISTANCE - lead);

    if (t <= 0) return 'ゲートが開くのを待っています。';
    if (prog < 0.12) return 'スタートしました。' + top.name + 'が先手を取りました。';
    if (prog < 0.45) {
      let s = top.name + 'が先頭、' + (second ? second.name + 'が続きます。' : '');
      s += PACE_LABEL + 'の流れ。';
      if (minePos) s += 'マイホースは' + minePos + '番手。';
      return s;
    }
    if (prog < 0.72) {
      return '残り' + remain + 'm、' + top.name + 'が先頭のまま3コーナーを回ります。'
        + (minePos ? 'マイホースは' + minePos + '番手から進出の構え。' : '');
    }
    if (prog < 0.93) {
      return '直線に入りました。' + top.name + 'が抜け出しにかかる。'
        + (second ? second.name + 'が食い下がります。' : '');
    }
    const winner = WINNER[0];
    if (t < winner.time) {
      return 'ゴール前、' + top.name + 'が先頭。' + (second ? second.name + 'との差はわずか。' : '')
        + (CLOSE_FINISH ? '接戦です！' : '');
    }
    if (t < MAX_TIME) {
      return 'ゴール！ ' + winner.name + 'が1着。'
        + (WINNER[1] ? WINNER[1].name + 'が' + marginLabel(WINNER[1].margin) + 'の2着。' : '');
    }
    return winner.name + 'が優勝しました。勝ちタイム ' + mmss(winner.time) + '。';
  }

  /** 秒の着差を競馬の表記にする（1馬身≒0.17秒）。 */
  function marginLabel(sec) {
    if (sec <= 0) return '同着';
    if (sec < 0.03) return 'ハナ';
    if (sec < 0.06) return 'アタマ';
    if (sec < 0.1) return 'クビ';
    const lengths = sec / 0.17;
    if (lengths >= 10) return '大差';
    const q = Math.round(lengths * 4) / 4;
    const whole = Math.floor(q), frac = q - whole;
    const fracText = frac === 0.25 ? '1/4' : frac === 0.5 ? '1/2' : frac === 0.75 ? '3/4' : '';
    if (whole === 0) return fracText + '馬身';
    return whole + (fracText ? ' ' + fracText : '') + '馬身';
  }

  // ====================================================
  // 全体の描画
  // ====================================================
  let camMode = 'chase';

  function render(t) {
    const positions = HORSES.map(function (h) { return distanceAt(h, t); });
    const lead = Math.max.apply(null, positions);

    // ⭕ ゴールした馬は着順で並べる。流しの距離で順位が入れ替わってはいけない
    const ranked = HORSES.map(function (h, i) { return { h: h, d: positions[i], done: t >= h.time }; })
      .sort(function (a, b) {
        if (a.done && b.done) return a.h.finish - b.h.finish;
        if (a.done !== b.done) return a.done ? -1 : 1;
        return b.d - a.d;
      });
    ranked.forEach(function (r, i) { r.h.currentPos = i + 1; });

    ctx.clearRect(0, 0, W, H);
    if (camMode === 'chase') drawChase(t, positions, ranked);
    else drawWide(t, positions, ranked);

    const remain = Math.max(0, DISTANCE - lead);
    document.getElementById('remain-n').textContent = Math.round(remain).toLocaleString();
    document.getElementById('clock-big').textContent = t.toFixed(1);
    document.getElementById('call').textContent = commentary(t, ranked, lead);
    updateLive(ranked, t);
    updateFinishPanel(t);
    document.getElementById('clock').textContent = t.toFixed(1) + 's';
  }

  /** 上位3頭がゴールしたら、確定パネルを出す（自分の馬も、ゴールしていれば足す）。 */
  const finishEl = document.getElementById('finish');
  const finishBody = document.getElementById('finish-body');
  function updateFinishPanel(t) {
    const third = WINNER[Math.min(2, WINNER.length - 1)];
    if (t < third.time) { finishEl.hidden = true; return; }
    const rows = WINNER.slice(0, 3);
    const mine = WINNER.filter(function (h) { return h.is_player; })[0];
    if (mine && rows.indexOf(mine) === -1 && t >= mine.time) rows.push(mine);
    finishBody.innerHTML = rows.map(function (h) {
      const src = HORSES.filter(function (x) { return x.no === h.no; })[0];
      return '<tr class="' + (h.is_player ? 'mine' : '') + '">'
        + '<td class="r">' + h.finish + '着</td>'
        + '<td><span class="chip" style="background:' + src.color.bg + ';color:' + src.color.fg + '">' + h.no + '</span></td>'
        + '<td class="nm">' + h.name + '</td>'
        + '<td class="tm">' + (h.finish === 1 ? mmss(h.time) : marginLabel(h.margin)) + '</td></tr>';
    }).join('');
    finishEl.hidden = false;
  }

  const liveEl = document.getElementById('live');
  function updateLive(ranked, t) {
    const leadD = ranked[0].d;
    const shown = ranked.slice(0, 5);
    const mine = ranked.filter(function (r) { return r.h.is_player; })[0];
    if (mine && shown.indexOf(mine) === -1) shown.push(mine);

    liveEl.innerHTML = shown.map(function (r) {
      const h = r.h;
      const behind = leadD - r.d;
      const gap = r.done
        ? (h.finish === 1 ? '1着' : marginLabel(h.margin))
        : (behind < 0.4 ? '先頭' : '-' + behind.toFixed(1) + 'm');
      return '<li class="' + (h.is_player ? 'mine' : '') + '">'
        + '<span class="rank">' + h.currentPos + '</span>'
        + '<span class="chip" style="background:' + h.color.bg + ';color:' + h.color.fg + '">' + h.no + '</span>'
        + '<span class="nm">' + h.name + '</span>'
        + '<span class="gp">' + gap + '</span></li>';
    }).join('');
  }

  // ====================================================
  // 見出し・出走表・結果
  // ====================================================
  function mmss(sec) {
    const total = Math.round(sec * 10) / 10;
    const m = Math.floor(total / 60), s = total - m * 60;
    return m > 0 ? m + ':' + (s < 10 ? '0' : '') + s.toFixed(1) : s.toFixed(1);
  }
  function chip(h) {
    return '<span class="chip" style="background:' + h.color.bg + ';color:' + h.color.fg + '">' + h.no + '</span>';
  }

  document.getElementById('title').textContent = RACE.name || 'レース';
  document.getElementById('meta').innerHTML =
    '<span><b>' + RACE.course + '</b> ' + RACE.surface + RACE.distance + 'm</span>'
    + '<span>馬場 <b>' + (RACE.cond || '良') + '</b></span>'
    + '<span><b>' + (RACE['class'] || '') + '</b></span>'
    + '<span><b>' + N + '</b>頭</span>';
  document.getElementById('pace-chip').textContent = PACE_LABEL;
  document.getElementById('footer').textContent = 'seed=' + DATA.seed + ' ／ 馬名はすべて架空です';

  document.getElementById('card-body').innerHTML = HORSES.map(function (h) {
    return '<tr class="' + (h.is_player ? 'mine' : '') + '"><td>' + (h.waku + 1) + '</td>'
      + '<td>' + chip(h) + '</td><td>' + h.name + '</td><td>' + h.style + '</td>'
      + '<td>' + h.coat.name + '</td></tr>';
  }).join('');

  document.getElementById('result-body').innerHTML = DATA.horses.map(function (h) {
    const src = HORSES.filter(function (x) { return x.no === h.no; })[0];
    const cls = (h.finish === 1 ? 'win' : '') + (h.is_player ? ' mine' : '');
    return '<tr class="' + cls + '"><td>' + h.finish + '</td><td>' + chip(src) + '</td>'
      + '<td>' + h.name + '</td><td class="num">' + mmss(h.time) + '</td>'
      + '<td class="num">' + (h.finish === 1 ? '—' : '+' + h.margin.toFixed(1)) + '</td>'
      + '<td class="num">' + h.last3f.toFixed(1) + '</td>'
      + '<td class="num">' + h.passing.join('-') + '</td><td>' + h.style + '</td></tr>';
  }).join('');

  const revealBtn = document.getElementById('reveal');
  const resultWrap = document.getElementById('result-wrap');
  function reveal() { resultWrap.hidden = false; revealBtn.hidden = true; }
  revealBtn.addEventListener('click', reveal);

  // ====================================================
  // 再生
  // ====================================================
  let t = 0, playing = false, speed = 1, last = 0;
  const playBtn = document.getElementById('play');
  const scrub = document.getElementById('scrub');

  function setPlaying(on) {
    playing = on;
    playBtn.textContent = on ? '⏸ 一時停止' : (t >= END_TIME ? '▶ もう一度' : '▶ スタート');
    if (on) { last = performance.now(); requestAnimationFrame(step); }
  }

  function step(now) {
    if (!playing) return;
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    // ⭕ 接戦なら、先頭がゴール前80mに入ったところからスローにする（等速のときだけ）
    const lead = Math.max.apply(null, HORSES.map(function (h) { return distanceAt(h, t); }));
    const slow = CLOSE_FINISH && speed === 1 && lead >= DISTANCE - 80 && t < WINNER[1].time + 0.3;
    t += dt * speed * (slow ? 0.3 : 1);
    if (t >= MAX_TIME) reveal();
    if (t >= END_TIME) { t = END_TIME; setPlaying(false); }
    scrub.value = String(Math.round(t / END_TIME * 1000));
    render(t);
    if (playing) requestAnimationFrame(step);
  }

  playBtn.addEventListener('click', function () {
    if (t >= END_TIME) t = 0;
    setPlaying(!playing);
  });
  document.getElementById('restart').addEventListener('click', function () {
    t = 0; scrub.value = '0'; render(t); setPlaying(false);
  });
  scrub.addEventListener('input', function () {
    setPlaying(false);
    t = Number(scrub.value) / 1000 * END_TIME;
    render(t);
  });
  function bindGroup(selector, apply) {
    const buttons = document.querySelectorAll(selector);
    buttons.forEach(function (b) {
      b.addEventListener('click', function () {
        apply(b);
        buttons.forEach(function (o) { o.setAttribute('aria-pressed', String(o === b)); });
        render(t);
      });
    });
  }
  bindGroup('.group.cams button', function (b) { camMode = b.dataset.cam; });
  bindGroup('.group:not(.cams) button', function (b) { speed = Number(b.dataset.speed); });

  render(0);
})();
</script>
