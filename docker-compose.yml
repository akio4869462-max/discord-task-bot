services:
  bot:
    build: .
    container_name: discord-task-bot
    restart: unless-stopped
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      NEWS_CHANNEL_ID: ${NEWS_CHANNEL_ID}
      TASK_CHANNEL_ID: ${TASK_CHANNEL_ID}
      GOOGLE_CALENDAR_ID: ${GOOGLE_CALENDAR_ID}
    volumes:
      - ./data:/app/data